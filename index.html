<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Super Admin Panel</title>
    <!-- --- INICIO: FAVICON AÑADIDO --- -->
    <link rel="icon" type="image/png" href="https://firebasestorage.googleapis.com/v0/b/lumix-financas-app.firebasestorage.app/o/LOGO---LUMIX-FINANZAS-REDUCIDO.png?alt=media&token=0b4c34d2-f2e3-44b3-a380-7aadfb9c0991">
    <!-- --- FIN: FAVICON AÑADIDO --- -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-light: #f1f5f9;
            --surface-light: #ffffff;
            --text-primary-light: #0f172a;
            --text-secondary-light: #64748b;
            --border-light: #e2e8f0;
            --accent-blue: #3b82f6;
            --accent-blue-darker: #2563eb;
            --danger-light: #ef4444;
            --warning-light: #f97316;

            --bg-dark: #020617;
            --surface-dark: #0f172a;
            --text-primary-dark: #e2e8f0;
            --text-secondary-dark: #94a3b8;
            --border-dark: #1e293b;
            --danger-dark: #f87171;
            --warning-dark: #fb923c;
        }

        /* Dark mode por defecto */
        body {
            --bg: var(--bg-dark);
            --surface: var(--surface-dark);
            --text-primary: var(--text-primary-dark);
            --text-secondary: var(--text-secondary-dark);
            --border-color: var(--border-dark);
            --danger-color: var(--danger-dark);
            --warning-color: var(--warning-dark);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg); color: var(--text-primary); transition: background-color 0.3s, color 0.3s; }

        @keyframes pulse { 0%{transform: scale(1); opacity: .9}50%{transform: scale(1.05); opacity: 1}100%{transform: scale(1); opacity: .9} }
        @keyframes subtle-glow { 0%,100%{filter: drop-shadow(0 0 8px rgba(138,43,226,.7))}50%{filter: drop-shadow(0 0 16px rgba(57,255,20,.7))} }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        /* --- Estilos Splash Screen --- */
        #splash-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: var(--bg); display: flex; justify-content: center; align-items: center; z-index: 10000; transition: opacity .5s ease-out }
        #splash-screen img { width: 150px; height: 150px; animation: pulse 2.5s infinite ease-in-out }

        /* --- Estilos Login View --- */
        #login-view {
            display: none; flex-direction: column; justify-content: center; align-items: center;
            height: 100%; padding: 20px; background-color: var(--bg);
        }
        .login-card {
            background-color: transparent; box-shadow: none; border: none;
            width: 100%; max-width: 400px; text-align: center;
        }
        .login-card .logo img { width: 100px; height: 100px; margin-bottom: 20px; filter: grayscale(50%) opacity(80%); }
        .login-card h2 { margin-bottom: 10px; font-size: 1.6em; font-weight: 700; color: var(--text-primary); }
        .login-card p { margin-bottom: 30px; color: var(--text-secondary); }
        .login-card .form-group { text-align: left; margin-bottom: 15px; }
        .login-card .form-group label { display: block; margin-bottom: 6px; font-weight: 500; color: var(--text-secondary); font-size: 0.9em; }
        .login-card .form-group input {
             width: 100%; padding: 15px; font-size: 1em; border-radius: 8px;
             border: 1px solid #334155;
             background-color: #1e293b;
             color: var(--text-primary);
             transition: border-color 0.2s, box-shadow 0.2s;
        }
        .login-card .form-group input:focus {
             border-color: var(--accent-blue); outline: none; box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }
        .login-card .btn-primary {
            width: 100%;
            padding: 15px;
            font-size: 1.1em;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background-color: var(--accent-blue);
            color: white;
            transition: background-color 0.2s;
            margin-top: 10px;
        }
        .login-card .btn-primary:hover { background-color: var(--accent-blue-darker); }
        .login-card .btn-primary:disabled { background-color: var(--text-secondary); cursor: not-allowed; opacity: 0.7; }

        /* --- Estilos App Container --- */
        #app-container { display: none; flex-direction: column; height: 100%; width: 100%; }
        .main-header {
            display: flex; justify-content: space-between; align-items: center; padding: 15px 20px;
            background-color: var(--surface); border-bottom: 1px solid var(--border-color); flex-shrink: 0;
        }
        .header-title { font-size: 1.2em; font-weight: 600; color: var(--text-primary); }
        .header-controls button {
            background: none; border: none; color: var(--text-secondary); cursor: pointer; padding: 5px;
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
        }
        main { flex-grow: 1; overflow-y: auto; }
        .container { padding: 20px; }
        .section-title { font-size: 1.3em; font-weight: 600; margin-bottom: 20px; padding-bottom: 10px; border-bottom: 1px solid var(--border-color); }
        .fab {
            position: fixed; bottom: 30px; right: 30px; width: 60px; height: 60px; background-color: var(--accent-blue);
            color: white; border-radius: 50%; border: none; box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 160;
        }
        /* --- Otros estilos generales --- */
        .btn-primary { background-color: var(--accent-blue); color: white; border: none; padding: 10px 15px; border-radius: 6px; cursor: pointer; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; }
        .btn-secondary { background-color: transparent; color: var(--accent-blue); border: 1px solid var(--accent-blue); padding: 10px 15px; border-radius: 6px; cursor: pointer; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; }
        .btn-danger { background-color: var(--danger-color); color: white; border: none; padding: 10px 15px; border-radius: 6px; cursor: pointer; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; }

        /* --- Estilos Modales --- */
        .modal-view, .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 200;
        }
        .modal-view {
            background-color: var(--bg); transform: translateX(100%); transition: transform 0.3s ease-in-out;
            display: flex; flex-direction: column;
        }
        .modal-view.active { transform: translateX(0); }
        .modal-overlay {
            background-color: rgba(0,0,0,0.6); backdrop-filter: blur(4px); display: none;
            justify-content: center; align-items: center; opacity: 0; transition: opacity 0.2s ease-in-out;
         }
         .modal-overlay.active { display: flex; opacity: 1; }
         .modal-content {
             background-color: var(--surface); padding: 20px; border-radius: 12px;
             width: 90%; max-width: 500px; box-shadow: 0 10px 30px rgba(0,0,0,0.2);
         }
         .modal-header {
             display: flex; align-items: center; padding: 15px 20px;
             background-color: var(--surface); border-bottom: 1px solid var(--border-color);
             flex-shrink: 0; position: sticky; top: 0; z-index: 1;
         }
         .modal-header button { background: none; border: none; color: var(--text-primary); cursor: pointer; margin-right: 15px; }
         .modal-title { font-size: 1.2em; font-weight: 600; }
         .modal-content-wrapper { flex-grow: 1; overflow-y: auto; padding: 20px; }
         .action-buttons {
             background-color: var(--surface); border-top: 1px solid var(--border-color);
             padding: 15px 20px; display: flex; gap: 10px; margin-top: auto;
             position: sticky; bottom: 0; flex-shrink: 0;
         }
         .action-buttons button { flex-grow: 1; padding: 15px; font-size: 1em; font-weight: 600; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
         .action-buttons button:disabled { background-color: var(--text-secondary); cursor: not-allowed; opacity: 0.7; }

        #toast-container { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 1000; display: flex; flex-direction: column; align-items: center; gap: 10px; }
        .toast { background-color: #333; color: white; padding: 10px 18px; border-radius: 6px; box-shadow: 0 3px 10px rgba(0,0,0,0.2); font-size: 0.9em; opacity: 0; transform: translateY(-15px); transition: opacity .3s, transform .3s; }
        .toast.show { opacity: 1; transform: translateY(0); }
        .toast.toast-error { background-color: var(--danger-color); }

        /* Estilos específicos del formulario */
        #companyFormModal .form-group { margin-bottom: 18px; }
        #companyFormModal .form-group label { margin-bottom: 6px; font-size: 0.9em; }
        #companyFormModal .form-group input,
        #companyFormModal .form-group select,
        #companyFormModal .form-group textarea {
            width: 100%; padding: 12px; font-size: 1em; border-radius: 8px;
            border: 1px solid var(--border-color); background-color: var(--surface); color: var(--text-primary);
        }
        #companyFormModal .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        #companyFormModal .section-title { margin-top: 25px; margin-bottom: 15px; padding-bottom: 8px; font-size: 1.1em; }

        /* --- Estilos Tabs y Controles --- */
        .plan-type-selector { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 25px; }
        .plan-type-selector input[type="radio"] { display: none; }
        .plan-type-selector label {
            display: block; padding: 15px; border: 2px solid var(--border-color); background-color: var(--surface);
            border-radius: 8px; cursor: pointer; text-align: center; font-weight: 600; transition: all 0.2s ease;
        }
        .plan-type-selector label:hover { border-color: var(--accent-blue); }
        .plan-type-selector input[type="radio"]:checked + label {
            background-color: var(--accent-blue); border-color: var(--accent-blue); color: white; box-shadow: 0 4px 12px rgba(59, 130, 246, 0.2);
        }
        .plan-fields-container { display: none; }

        #companies-list .company-card, .blacklist-card {
             background-color: var(--surface); padding: 15px 20px; border-radius: 12px;
             margin-bottom: 12px; border: 1px solid var(--border-color);
             display: flex; justify-content: space-between; align-items: center;
             cursor: pointer; transition: box-shadow 0.2s, transform 0.2s;
        }
        #companies-list .company-card:hover, .blacklist-card:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(59, 130, 246, 0.1); }
        #companies-list .company-card h4 { margin: 0 0 4px; font-size: 1.1em; }
        #companies-list .company-card p { font-size: 0.85em; color: var(--text-secondary); margin: 0; }
        
        #companies-list .company-card .company-card-info { flex-grow: 1; min-width: 0; }
        #companies-list .company-card .company-tags { display: flex; gap: 8px; margin-top: 12px; }
        .plan-tag, .status-tag { display: inline-flex; align-items: center; gap: 5px; font-size: 0.75em; font-weight: 600; padding: 4px 10px; border-radius: 20px; }
        .plan-tag i, .status-tag i { width: 14px; height: 14px; }
        
        .plan-tag.plan-pro { background-color: #c7d2fe; color: #3730a3; }
        .plan-tag.plan-demo { background-color: #fef08a; color: #713f12; }
        .status-tag.status-paid { background-color: #dcfce7; color: #15803d; }
        .status-tag.status-due { background-color: #fee2e2; color: #b91c1c; }
        .status-tag.status-pending { background-color: #fef3c7; color: #9a3412; }

        #companies-list .company-card .company-card-details { display: flex; flex-direction: column; align-items: flex-end; justify-content: center; flex-shrink: 0; margin-left: 15px; }
        #companies-list .company-card .detail-item { display: flex; align-items: center; gap: 6px; font-size: 0.85em; color: var(--text-secondary); }
        #companies-list .company-card .detail-item:first-child { margin-bottom: 5px; }

        .tab-bar { display: flex; gap: 8px; margin-bottom: 20px; border-bottom: 1px solid var(--border-color); overflow-x: auto; }
        .tab-bar .tab-btn {
            background: none; border: none; color: var(--text-secondary); font-size: 1em; font-weight: 600;
            padding: 10px 18px; cursor: pointer; border-bottom: 3px solid transparent;
            display: inline-flex; align-items: center; gap: 8px; white-space: nowrap;
        }
        .tab-bar .tab-btn:hover { color: var(--text-primary); }
        .tab-bar .tab-btn.active { color: var(--accent-blue); border-bottom-color: var(--accent-blue); }

        .search-bar-container {
            display: flex; align-items: center; background-color: var(--surface);
            border: 1px solid var(--border-color); border-radius: 8px; padding: 0 12px;
            margin-bottom: 15px; transition: border-color 0.2s, box-shadow 0.2s;
        }
        .search-bar-container:focus-within { border-color: var(--accent-blue); box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2); }
        .search-bar-container input { flex-grow: 1; padding: 14px 10px; border: none; background: none; color: var(--text-primary); font-size: 1em; outline: none; }
        .search-bar-container #clear-search-btn { background: none; border: none; color: var(--text-secondary); cursor: pointer; padding: 4px; border-radius: 50%; }

        .filter-bar { display: flex; gap: 15px; flex-wrap: wrap; }
        .filter-group { display: flex; flex-direction: column; flex-grow: 1; min-width: 150px; }
        .filter-group label { font-size: 0.8em; font-weight: 500; color: var(--text-secondary); margin-bottom: 5px; }
        .filter-group select {
            padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border-color);
            background-color: var(--surface); color: var(--text-primary); font-size: 0.9em; font-weight: 500;
        }

        /* --- ESTILOS BLACKLIST (RIESGO) --- */
        .main-nav {
            display: flex;
            background-color: var(--surface);
            border-bottom: 1px solid var(--border-color);
            padding: 0 10px;
            overflow-x: auto;
        }
        .nav-btn {
            background: none; border: none; padding: 15px;
            color: var(--text-secondary); font-weight: 600; cursor: pointer;
            border-bottom: 3px solid transparent; display: flex; align-items: center; gap: 8px;
            white-space: nowrap;
        }
        .nav-btn.active { 
            color: var(--accent-blue); 
            border-bottom-color: var(--accent-blue); 
        }

        /* Tarjeta Roja para la Lista Negra */
        .blacklist-card {
            background-color: var(--surface);
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid var(--danger-color); /* Borde rojo a la izquierda */
            margin-bottom: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .blacklist-header { display: flex; justify-content: space-between; margin-bottom: 5px; align-items: center; }
        .blacklist-cpf { font-weight: bold; font-family: monospace; font-size: 1.1em; color: var(--danger-color); }
        .blacklist-reason { font-style: italic; color: var(--text-secondary); font-size: 0.9em; margin-top: 5px; }

    </style>
</head>

                <button id="logout-btn" title="Cerrar Sesión"><i data-lucide="log-out"></i></button>

        <!-- 3. ÁREA DE CONTENIDO (Con scroll independiente) -->
        <main style="flex-grow: 1; overflow-y: auto; position: relative; padding-bottom: 80px;">
            
            <!-- VISTA 1: EMPRESAS -->
            <div id="companies-view" class="view-section container">
                <h2 class="section-title">Empresas Registradas</h2>

                <div class="controls-container" style="margin-bottom: 20px;">

                        <button class="tab-btn active" data-tab="pro">

                            <i data-lucide="play-circle"></i> Clientes DEMO
                        </button>
                    </div>

                    <!-- Buscador -->
                    <div class="search-bar-container">
                        <i data-lucide="search"></i>
                        <input type="text" id="company-search" placeholder="Buscar empresa o dueño...">

                    <!-- Filtros -->
                    <div class="filter-bar" id="pro-filters-container">

                            <label for="sort-order">Ordenar por:</label>

                                <option value="due_date">Vencimento (Próximo)</option>
                                <option value="alphabetical_asc">Nome (A-Z)</option>
                                <option value="alphabetical_desc">Nome (Z-A)</option>
                                <option value="newest">Mais Recentes</option>
                            </select>
                        </div>
                        <div class="filter-group">
                            <label for="plan-filter">Filtrar Plano:</label>
                            <select id="plan-filter">
                                <option value="all">Todos os Planos PRO</option>
                                <option value="1m">Mensal</option>

                    <p style="text-align:center; padding: 20px; color: gray;">Cargando lista...</p>

                    <h4 style="margin-top:0; color: var(--danger-color); display:flex; align-items:center; gap:8px;">

                    <div class="form-group">
                        <input type="text" id="bl-cpf" placeholder="CPF del Cliente" style="width: 100%; margin-bottom: 10px;">

                        <textarea id="bl-reason" placeholder="Motivo (Ej: Clavo, Volado...)" rows="2" style="width: 100%; margin-bottom: 10px;"></textarea>
                        <button onclick="addToBlacklist()" class="btn-danger" style="width: 100%; justify-content: center;">
                            <i data-lucide="plus-circle"></i> Agregar a Lista Negra
                        </button>
                    </div>
                </div>

                <!-- Buscador Blacklist -->
                <div class="search-bar-container" style="border-color: var(--danger-color);">
                    <i data-lucide="search"></i>
                    <input type="text" id="blacklist-search" placeholder="Buscar CPF bloqueado..." onkeyup="renderBlacklist()">
                </div>

                <div id="blacklist-list" style="margin-top: 15px;">
                    <p style="text-align: center; color: var(--text-secondary);">Cargando...</p>
                </div>
            </div>

        </main>

        <!-- Botón Flotante (FAB) -->
        <button class="fab" id="mainFabBtn" title="Añadir"><i data-lucide="plus"></i></button>
    </div>

        // --- INICIO: NUEVA Función de Filtro y Renderizado ---
        function filterAndRenderCompanies() {
            let filteredCompanies = [...allCompanies]; // Copia para no modificar la original

            // 1. Filtrar por Pestaña (PRO / DEMO)
            filteredCompanies = filteredCompanies.filter(company => {
                const planType = company.plan?.type || 'pro'; // Asume 'pro' si no existe
                return planType === currentFilterTab;
            });

            // 2. Filtrar por Barra de Búsqueda (Nombre de Empresa O Propietario)
            if (currentSearchTerm) {
                const term = currentSearchTerm.toLowerCase().trim();
                filteredCompanies = filteredCompanies.filter(company => {
                    const companyName = company.name?.toLowerCase() || '';
                    const ownerName = company.owner?.name?.toLowerCase() || '';
                    return companyName.includes(term) || ownerName.includes(term);
                });
            }

            // 3. Filtrar por Tipo de Plan PRO (solo si la pestaña PRO está activa)
            if (currentFilterTab === 'pro' && currentPlanFilter !== 'all') {
                filteredCompanies = filteredCompanies.filter(company => {
                    const planDuration = company.plan?.plan; // '1m', '3m', '1y', etc.
                    return planDuration === currentPlanFilter;
                });
            }

            // 4. Ordenar
            switch (currentSortOrder) {
                case 'due_date':
                    // Ordena por fecha de vencimiento (los más cercanos primero)
                    // Los que no tienen fecha (null/undefined) van al final.
                    filteredCompanies.sort((a, b) => {
                        const aDate = a.plan?.endDate?.seconds || Infinity;
                        const bDate = b.plan?.endDate?.seconds || Infinity;
                        return aDate - bDate;
                    });
                    break;
                case 'alphabetical_asc':
                    filteredCompanies.sort((a, b) => (a.name || '').localeCompare(b.name || ''));
                    break;
                case 'alphabetical_desc':
                    filteredCompanies.sort((a, b) => (b.name || '').localeCompare(a.name || ''));
                    break;
                case 'newest':
                    // Ordena por fecha de creación (los más nuevos primero)
                    filteredCompanies.sort((a, b) => {
                        const aDate = a.createdAt?.seconds || 0;
                        const bDate = b.createdAt?.seconds || 0;
                        return bDate - aDate; // Descendente
                    });
                    break;
            }

            // 5. Finalmente, llamar a renderCompaniesList con la lista filtrada y ordenada
            renderCompaniesList(filteredCompanies);
        }

        // --- FUNCIÓN DE SUSPENSIÓN AUTOMÁTICA ---
        async function checkAndSuspendExpiredCompanies() {
            console.log("Verificando vencimientos de empresas...");
            const now = new Date();
            const batch = writeBatch(db); // Prepara un paquete de actualizaciones
            let suspendedCount = 0;
            let changesDetected = false;

            allCompanies.forEach(company => {
                // Si ya está suspendida o es el propio Super Admin (opcional), saltar
                if (company.status === 'suspended') return;

                let endDate = null;

                // 1. Intentar obtener fecha de fin explícita (si ya se guardó)
                // Buscamos en company.plan.endDate o company.planEndDate por compatibilidad
                const storedEndDate = company.plan?.endDate || company.planEndDate;
                
                if (storedEndDate?.seconds) {
                    endDate = new Date(storedEndDate.seconds * 1000);
                } 
                // 2. Si no hay fecha guardada, CALCULARLA basándose en creación + plan
                else if (company.createdAt?.seconds && company.plan) {
                    const startDate = new Date(company.createdAt.seconds * 1000);
                    const plan = company.plan;
                    endDate = new Date(startDate); // Clonamos fecha inicio

                    // Cálculo para DEMO (Días)
                    if (plan.type === 'demo' && plan.duration) {
                        const days = parseInt(plan.duration.replace('d', '')) || 0;
                        endDate.setDate(endDate.getDate() + days);
                    } 
                    // Cálculo para PRO (Meses)
                    else if (plan.type === 'pro' && plan.plan) {
                        const durationMap = { '1m': 1, '3m': 3, '6m': 6, '1y': 12 };
                        const months = durationMap[plan.plan] || 0;
                        endDate.setMonth(endDate.getMonth() + months);
                    } else {
                        // Si no se puede determinar el plan, no hacemos nada por seguridad
                        endDate = null;
                    }
                }

                // 3. Evaluar Vencimiento
                if (endDate) {
                    // Ponemos endDate al final del día para dar margen (23:59:59)
                    // O lo dejamos exacto. Si quieres ser estricto: endDate < now.
                    // Si la fecha de vencimiento ya pasó hoy:
                    if (endDate < now) {
                        console.log(`SUSPENDIENDO: ${company.name}. Venció: ${endDate.toLocaleDateString()}`);
                        const companyRef = doc(db, 'companies', company.id);
                        batch.update(companyRef, { status: 'suspended' });
                        suspendedCount++;
                        changesDetected = true;
                    }
                }
            });

            // 4. Ejecutar cambios en la base de datos
            if (changesDetected) {
                try {
                    await batch.commit();
                    showToast(`${suspendedCount} contas vencidas foram suspensas automaticamente.`, true); // Usamos true para rojo/alerta
                    console.log(`Proceso completado: ${suspendedCount} empresas suspendidas.`);
                } catch (error) {
                    console.error("Error al suspender cuentas automáticamente:", error);
                }
            } else {
                console.log("Ninguna cuenta vencida pendiente de suspensión.");
            }
        }

            // Escucha la colección /companies
            onSnapshot(collection(db, 'companies'), (snapshot) => {
                allCompanies = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                
                // 1. Ejecutar verificación de vencimientos AUTOMÁTICAMENTE
                checkAndSuspendExpiredCompanies();

            }, (error) => {

        }

                const today = new Date();
                today.setHours(0, 0, 0, 0);

                const createdAtTimestamp = company.createdAt;
                const createdAtFormatted = createdAtTimestamp?.seconds 
                    ? new Date(createdAtTimestamp.seconds * 1000).toLocaleDateString('pt-BR') 
                    : 'N/A';

                const planEndDateTimestamp = plan.endDate || company.planEndDate;
                const planEndDate = planEndDateTimestamp?.seconds ? new Date(planEndDateTimestamp.seconds * 1000) : null;

                if (company.status === 'suspended') {
                    statusKey = 'Suspensa';
                    statusClass = 'status-due';
                    statusIcon = 'pause-circle';

                    planEndDate.setHours(0, 0, 0, 0);

                    if (diffDays < 0) {
                        statusKey = `Vencido (${Math.abs(diffDays)}d)`;

                        statusIcon = 'alert-circle';

                        <!-- SECCIÓN DE CREDENCIALES -->

                        <div class="form-group">

                                   value="${existingEmail}" 
                                   placeholder="${isEditMode ? 'Edite o email se necessário' : 'email@exemplo.com'}"
                                   required style="background-color: var(--surface); border-color: var(--accent-blue);" 
                                   autocomplete="off">
                            <p style="font-size: 0.8em; color: var(--text-secondary); margin-top: 5px;">
                                ℹ️ Você pode corrigir este email se estiver errado.
                            </p>
                        </div>

                        <div class="form-group">
                            <label for="admin-password">${isEditMode ? 'Nova Senha' : 'Senha Temporária do Admin'}</label>
                            <input type="text" id="admin-password" 
                                   ${!isEditMode ? 'required' : ''} 
                                   placeholder="${isEditMode ? 'Deixe em branco para manter a atual' : 'Mínimo 6 caracteres'}" 
                                   autocomplete="new-password">
                            
                            <p style="font-size: 0.8em; color: var(--text-secondary); margin-top: 5px;">
                                ${isEditMode ? 'Preencha apenas se desejar alterar a senha do administrador.' : 'Mínimo 6 caracteres.'}

                    </form>
                </div>
                <div class="action-buttons" style="flex-wrap: wrap;"> 
                    
                    ${isEditMode ? `
                    <button id="deleteCompanyBtn" class="btn-danger" style="background-color: transparent; border: 2px solid var(--danger-color); color: var(--danger-color); flex-basis: 100%; order: 3;">
                        <i data-lucide="trash-2"></i> Eliminar Empresa
                    </button>
                    ` : ''}

                    ${isEditMode ? `
                    <button id="suspendCompanyBtn" class="btn-secondary" style="background-color: transparent; border: 2px solid var(--warning-color); color: var(--warning-color); flex-grow: 1; order: 2;">
                        <!-- El texto se pondrá con JS -->
                    </button>
                    ` : ''}

                    <button id="saveCompanyBtn" class="btn-primary" style="flex-grow: 1; order: 1;">
                        <i data-lucide="save"></i> ${saveButtonText}
                    </button>

                </div>
            `;

            modal.classList.add('active');
            history.pushState({ modal: 'companyForm' }, modalTitle);
            lucide.createIcons({ nodes: modal.querySelectorAll('[data-lucide]') });

            // --- Lógica para poblar formulario ---
            if (isEditMode && companyData.plan) {
                const plan = companyData.plan;
                const demoFields = modal.querySelector('#demo-form-fields');
                const proFields = modal.querySelector('#pro-form-fields');

                if (plan.type === 'demo') {
                    modal.querySelector('#plan-type-demo').checked = true;
                    demoFields.style.display = 'block';
                    proFields.style.display = 'none';
                    modal.querySelector('#demo-duration').value = plan.duration || '7d';
                    
                    const demoLimitSelect = modal.querySelector('#demo-collector-limit');
                    const demoLimitType = plan.collectorLimitType || plan.collectorLimit?.toString();
                    
                    if (demoLimitSelect.querySelector(`option[value="${demoLimitType}"]`)) {
                        demoLimitSelect.value = demoLimitType;
                    } else if (demoLimitType) {
                        demoLimitSelect.value = 'custom';
                        modal.querySelector('#demo-custom-limit-group').style.display = 'block';
                        modal.querySelector('#demo-custom-collector-limit').value = plan.collectorLimit || 0;
                    }

                } else if (plan.type === 'pro') {
                    modal.querySelector('#plan-type-pro').checked = true;
                    demoFields.style.display = 'none';
                    proFields.style.display = 'block';
                    modal.querySelector('#pro-plan-type').value = plan.plan || '1m';
                    modal.querySelector('#pro-plan-value').value = plan.value || 0;

                    if (plan.endDate) {
                        try {
                            const endDate = new Date(plan.endDate.seconds * 1000);
                            const isoDate = endDate.toISOString().split('T')[0]; 
                            modal.querySelector('#pro-manual-expiration').value = isoDate;
                        } catch(e) { console.error("Error parseando fecha", e); }
                    }

                    const proLimitSelect = modal.querySelector('#pro-collector-limit');
                    const proLimitType = plan.collectorLimitType || plan.collectorLimit?.toString();

                    if (proLimitSelect.querySelector(`option[value="${proLimitType}"]`)) {
                        proLimitSelect.value = proLimitType;
                    } else if (proLimitType) {
                        proLimitSelect.value = 'custom';
                        modal.querySelector('#pro-custom-limit-group').style.display = 'block';
                        modal.querySelector('#pro-custom-collector-limit').value = plan.collectorLimit || 0;
                    }
                }
            }

            modal.querySelector('#closeCompanyFormModal').addEventListener('click', () => window.history.back());

            // --- Listeners de UI ---
            const demoFields = modal.querySelector('#demo-form-fields');
            const proFields = modal.querySelector('#pro-form-fields');

            if (!isEditMode) {
                demoFields.style.display = 'block';
            }

            modal.querySelectorAll('input[name="plan-type"]').forEach(radio => {
                radio.addEventListener('change', (e) => {
                    if (e.target.value === 'demo') {
                        demoFields.style.display = 'block';
                        proFields.style.display = 'none';
                    } else {
                        demoFields.style.display = 'none';
                        proFields.style.display = 'block';
                    }
                });
            });

            modal.querySelectorAll('.collector-limit-select').forEach(select => {
                select.addEventListener('change', (e) => {
                    const isDemo = e.target.id === 'demo-collector-limit';
                    const customGroup = modal.querySelector(isDemo ? '#demo-custom-limit-group' : '#pro-custom-limit-group');
                    const customInput = modal.querySelector(isDemo ? '#demo-custom-collector-limit' : '#pro-custom-collector-limit');
                    if (e.target.value === 'custom') {
                        customGroup.style.display = 'block';
                        customInput.required = true;
                    } else {
                        customGroup.style.display = 'none';
                        customInput.required = false;
                        customInput.value = '';
                    }
                });
            });

            // --- LISTENER DE GUARDADO PRINCIPAL ---
            modal.querySelector('#saveCompanyBtn').addEventListener('click', async (e) => {
                const saveButton = e.currentTarget;
                const originalButtonHTML = saveButton.innerHTML;

                const companyName = document.getElementById('company-name').value.trim();
                const ownerName = document.getElementById('owner-name').value.trim();
                const ownerDocument = document.getElementById('owner-document').value.trim();
                const ownerWhatsapp = document.getElementById('owner-whatsapp').value.trim();
                const companyCity = document.getElementById('company-city').value.trim();
                const currency = document.getElementById('company-currency').value || 'BRL';
                const requireGps = false;

                const adminEmailInput = document.getElementById('admin-email');
                const adminPasswordInput = document.getElementById('admin-password');
                const adminEmail = adminEmailInput ? adminEmailInput.value.trim() : null;
                const adminPassword = adminPasswordInput ? adminPasswordInput.value : null;

                if (!companyName || !ownerName || !ownerDocument || !ownerWhatsapp || !companyCity) {
                    showToast('Preencha todos os dados da empresa e do proprietário.', true); return;
                }
                
                if (!adminEmail) {
                    showToast('O email do administrador é obrigatório.', true); return;
                }
                if (!isEditMode && (!adminPassword || adminPassword.length < 6)) {
                    showToast('Senha (mín. 6 caracteres) é obrigatória na criação.', true); return;
                }

                saveButton.disabled = true;
                saveButton.innerHTML = `<i data-lucide="loader-circle" style="animation: spin 1s linear infinite;"></i> ${isEditMode ? 'Salvando...' : 'Criando...'}`;
                lucide.createIcons({ nodes: [saveButton.querySelector('i')] });

                const companySettings = { currency, requireGps };
                const ownerData = { name: ownerName, document: ownerDocument, whatsapp: ownerWhatsapp };
                let companyPlan = {};

                try {
                    const accountType = modal.querySelector('input[name="plan-type"]:checked').value;
                    let collectorLimit = 0;
                    let collectorLimitType = '';

                    if (accountType === 'demo') {
                        const duration = modal.querySelector('#demo-duration').value;
                        const limitSelect = modal.querySelector('#demo-collector-limit');
                        collectorLimitType = limitSelect.value;

                        if (collectorLimitType === 'custom') {
                            collectorLimit = parseInt(modal.querySelector('#demo-custom-collector-limit').value);
                            if (isNaN(collectorLimit) || collectorLimit <= 0) {
                                    showToast('Número de cobradores personalizado inválido.', true);
                                    saveButton.disabled = false; saveButton.innerHTML = originalButtonHTML; return;
                            }
                        } else {
                            collectorLimit = parseInt(collectorLimitType);
                        }

                        companyPlan = {
                            type: 'demo',
                            duration: duration,
                            text: `Demo (${modal.querySelector('#demo-duration option:checked').text})`,
                            collectorLimit: collectorLimit,
                            collectorLimitType: collectorLimitType,
                            value: 0,
                            currency: currency
                        };

                    } else if (accountType === 'pro') {
                        const planType = modal.querySelector('#pro-plan-type').value;
                        const planText = modal.querySelector('#pro-plan-type option:checked').text;
                        const planValueInput = modal.querySelector('#pro-plan-value');
                        const planValue = parseFloat(planValueInput.value);
                        const limitSelect = modal.querySelector('#pro-collector-limit');
                        collectorLimitType = limitSelect.value;

                        if (isNaN(planValue) || planValue < 0) {
                            showToast('Valor do plano inválido.', true);
                            saveButton.disabled = false; saveButton.innerHTML = originalButtonHTML; return;
                        }

                        if (collectorLimitType === 'custom') {
                            collectorLimit = parseInt(modal.querySelector('#pro-custom-collector-limit').value);
                            if (isNaN(collectorLimit) || collectorLimit <= 0) {
                                    showToast('Número de cobradores personalizado inválido.', true);
                                    saveButton.disabled = false; saveButton.innerHTML = originalButtonHTML; return;
                            }
                        } else {
                            collectorLimit = parseInt(collectorLimitType);
                        }

                        companyPlan = {
                            type: 'pro',
                            plan: planType,
                            text: `PRO (${planText})`,
                            collectorLimit: collectorLimit,
                            collectorLimitType: collectorLimitType,
                            value: planValue,
                            currency: currency
                        };
                    }

                    if (!companyPlan.type) throw new Error('Erro ao processar o tipo de plano.');

                    if (isEditMode) {
                        // --- MODO EDICIÓN ---
                        console.log("Modo Edição...");

                        if (adminPassword) {
                            if (adminPassword.length < 6) {
                                showToast('A nova senha deve ter no mínimo 6 caracteres.', true);
                                saveButton.disabled = false; saveButton.innerHTML = originalButtonHTML; return;
                            }
                            console.log("Detectada alteração de senha...");
                            if (!auth.currentUser) throw new Error("Super Admin não autenticado.");
                            const idToken = await auth.currentUser.getIdToken(true);
                            const authUrl = "https://us-central1-lumix-financas-app.cloudfunctions.net/updateCompanyAuth";
                            await fetch(authUrl, {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${idToken}` },
                                body: JSON.stringify({ data: { adminEmail: adminEmail, newPassword: adminPassword } })
                            });
                            showToast("Senha alterada com sucesso!");
                        }

                        const manualDateInput = document.getElementById('pro-manual-expiration');
                        let manualTimestamp = null;
                        
                        if (companyPlan.type === 'pro' && manualDateInput && manualDateInput.value) {
                             const [year, month, day] = manualDateInput.value.split('-').map(Number);
                             const manualDate = new Date(year, month - 1, day, 23, 59, 59);
                             manualTimestamp = Timestamp.fromDate(manualDate);
                        }

                        if (manualTimestamp) {
                            companyPlan.endDate = manualTimestamp;
                        } else {
                            const oldPlanType = companyData.plan?.type || 'pro';
                            const newPlanType = companyPlan.type;

                            if (oldPlanType === 'demo' && newPlanType === 'pro') {
                                const now = new Date();
                                let newPlanEndDate = new Date(now);
                                const planDuration = companyPlan.plan || '1m';
                                const durationValue = parseInt(planDuration.slice(0, -1)) || 1;
                                const durationUnit = planDuration.slice(-1);

                                if (durationUnit === 'm') newPlanEndDate.setMonth(newPlanEndDate.getMonth() + durationValue);
                                else if (durationUnit === 'y') newPlanEndDate.setFullYear(newPlanEndDate.getFullYear() + durationValue);
                                
                                companyPlan.endDate = Timestamp.fromDate(newPlanEndDate); 
                            } else {
                                companyPlan.endDate = companyData.plan.endDate;
                            }
                        }

                        console.log("Atualizando Firestore com o novo plano y moneda...");
                        await updateDoc(doc(db, 'companies', companyId), {
                            name: companyName,
                            owner: ownerData,
                            city: companyCity,
                            plan: companyPlan,
                            adminEmail: adminEmail,
                            settings: companySettings // CAMBIO CRÍTICO: Aquí se guarda la nueva moneda
                        });
                        
                        showToast('Empresa atualizada com sucesso!');
                        window.history.back();

                    } else {
                        // --- MODO CREACIÓN ---
                        const companyBaseData = {
                            name: companyName,
                            owner: ownerData,
                            city: companyCity,
                            settings: companySettings,
                            plan: companyPlan
                        };

                        if (!auth.currentUser) throw new Error("Usuário Super Admin não autenticado.");
                        const idToken = await auth.currentUser.getIdToken(true);
                        const functionUrl = "https://us-central1-lumix-financas-app.cloudfunctions.net/createCompanyAndAdmin";

                        const dataToSend = {
                            companyData: companyBaseData,
                            adminEmail: adminEmail,
                            adminPassword: adminPassword
                        };

                        const response = await fetch(functionUrl, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${idToken}` },
                            body: JSON.stringify({ data: dataToSend })
                        });
                        const resultWrapper = await response.json();
                        const resultData = resultWrapper.result || resultWrapper;

                        if (resultData && resultData.success) {
                            showToast(`Empresa criada com sucesso!`);
                            window.history.back();
                        } else {
                            const errorMsg = resultWrapper.error?.message || resultWrapper.error || resultData.error || 'Erro desconhecido no servidor.';
                            throw new Error(errorMsg);
                        }
                    } 

                } catch (generalError) {
                    console.error("Error general:", generalError);
                    let msg = generalError.message;
                    if (msg && (msg.includes("email-already-in-use") || msg.includes("already in use") || msg.includes("email-already-exists"))) {
                        msg = "Este email já está registrado no sistema. Use outro email ou exclua o usuário no painel do Firebase Auth.";
                    }
                    showToast(`Erro: ${msg}`, true);
                    saveButton.disabled = false;
                    saveButton.innerHTML = originalButtonHTML;
                    if (document.body.contains(saveButton)) {
                         lucide.createIcons({ nodes: [saveButton.querySelector('i')] });
                    }
                }
            });

            // Lógica de los botones SUSPENDER y ELIMINAR (Solo edición)
            if (isEditMode) {
                const suspendButton = modal.querySelector('#suspendCompanyBtn');
                const deleteButton = modal.querySelector('#deleteCompanyBtn');
                let currentStatus = companyData.status || 'active'; 

                // --- LÓGICA BOTÓN SUSPENDER ---
                const updateButtonState = (status) => {
                    if (status === 'active') {
                        suspendButton.innerHTML = `<i data-lucide="pause-circle"></i> Suspender Empresa`;
                        suspendButton.style.color = 'var(--warning-color)';
                        suspendButton.style.borderColor = 'var(--warning-color)';
                    } else {
                        suspendButton.innerHTML = `<i data-lucide="play-circle"></i> Reativar Empresa`;
                        suspendButton.style.color = 'var(--accent-blue)';
                        suspendButton.style.borderColor = 'var(--accent-blue)';
                    }
                    lucide.createIcons({ nodes: [suspendButton.querySelector('i')] });
                };
                updateButtonState(currentStatus);

                suspendButton.addEventListener('click', async (e) => {
                    const newStatus = currentStatus === 'active' ? 'suspended' : 'active';
                    const actionText = newStatus === 'suspended' ? 'Suspender' : 'Reativar';
                    
                    let isExpired = false;
                    const now = new Date();
                    const endDateRef = companyData.plan?.endDate || companyData.planEndDate;
                    if (newStatus === 'active' && endDateRef?.seconds) {
                        const endDate = new Date(endDateRef.seconds * 1000);
                        if (endDate < now) {
                            isExpired = true;
                        }
                    }

                    let confirmMsg = `¿Estás seguro de que deseas ${actionText.toLowerCase()} a "${companyData.name}"?`;
                    if (isExpired) {
                        confirmMsg += `\n\n⚠️ ATENÇÃO: Esta conta está VENCIDA. Ao reativar, o sistema adicionará automaticamente 2 DIAS DE CORTESIA para que ela não seja bloqueada novamente de imediato.`;
                    }

                    const confirmed = await showConfirmationModal(
                        `¿${actionText} Empresa?`, 
                        confirmMsg, 
                        `Sim, ${actionText}`, 
                        newStatus === 'suspended' ? 'btn-danger' : 'btn-primary'
                    );

                    if (!confirmed) return;

                    const originalButtonHTML = suspendButton.innerHTML;
                    suspendButton.disabled = true;
                    suspendButton.innerHTML = `<i data-lucide="loader-circle" style="animation: spin 1s linear infinite;"></i> Processando...`;
                    lucide.createIcons({ nodes: [suspendButton.querySelector('i')] });

                    try {
                        const updates = { status: newStatus };

                        if (isExpired) {
                            const graceDate = new Date();
                            graceDate.setDate(graceDate.getDate() + 2); 
                            
                            if (companyData.plan) {
                                updates['plan.endDate'] = Timestamp.fromDate(graceDate);
                            } else {
                                updates['planEndDate'] = Timestamp.fromDate(graceDate);
                            }
                            console.log("Aplicando periodo de gracia de 2 días.");
                        }

                        await updateDoc(doc(db, 'companies', companyId), updates);
                        
                        let successMsg = `Empresa ${newStatus === 'suspended' ? 'suspensa' : 'reativada'} com sucesso!`;
                        if (isExpired) successMsg += " (2 dias de cortesia adicionados)";
                        
                        showToast(successMsg);
                        currentStatus = newStatus;
                        updateButtonState(currentStatus);
                        suspendButton.disabled = false;
                        window.history.back();

                    } catch (error) {
                        console.error("Erro ao atualizar status:", error);
                        showToast(`Erro ao ${actionText.toLowerCase()}: ${error.message}`, true);
                        suspendButton.disabled = false;
                        suspendButton.innerHTML = originalButtonHTML;
                        lucide.createIcons({ nodes: [suspendButton.querySelector('i')] });
                    }
                });

                if (deleteButton) {
                    deleteButton.addEventListener('click', async () => {
                        const confirmed = await showConfirmationModal(
                            'Eliminar Empresa?',
                            `ATENÇÃO: Você está prestes a excluir permanentemente a empresa "${companyData.name}". Deseja continuar?`,
                            'Sim, Excluir',
                            'btn-danger'
                        );
                        if (!confirmed) return;
                        const originalHTML = deleteButton.innerHTML;
                        deleteButton.disabled = true;
                        deleteButton.innerHTML = `<i data-lucide="loader-circle" style="animation: spin 1s linear infinite;"></i> Excluindo...`;
                        lucide.createIcons({ nodes: [deleteButton.querySelector('i')] });

                        try {
                            await deleteDoc(doc(db, 'companies', companyId));
                            showToast('Empresa excluída com sucesso.');
                            window.history.back(); 
                        } catch (error) {
                            console.error("Erro ao excluir empresa:", error);
                            showToast(`Erro ao excluir: ${error.message}`, true);
                            deleteButton.disabled = false;
                            deleteButton.innerHTML = originalHTML;
                            lucide.createIcons({ nodes: [deleteButton.querySelector('i')] });
                        }
                    });
                }
            }
        }


        // --- Event Listeners Globales ---
        function setupSuperAdminEventListeners() {
            // Limpia listeners anteriores para evitar duplicados
            const oldLogoutBtn = document.getElementById('logout-btn');
            const newLogoutBtn = oldLogoutBtn.cloneNode(true); // Clona para limpiar listeners
            oldLogoutBtn.parentNode.replaceChild(newLogoutBtn, oldLogoutBtn);
            newLogoutBtn.addEventListener('click', async () => {
                showToast('Cerrando sesión...', false);
                try {
                    await signOut(auth);
                    // onAuthStateChanged se encargará de mostrar el login
                    console.log("Logout OK");
                } catch (error) {
                    console.error("Error en Logout:", error);
                    showToast('Error al cerrar sesión.', true);
                }
            });

            // FAB
            const oldAddBtn = document.getElementById('mainFabBtn');
            const newAddBtn = oldAddBtn.cloneNode(true);
            oldAddBtn.parentNode.replaceChild(newAddBtn, oldAddBtn);
                 newAddBtn.addEventListener('click', () => {
                 // Si estamos en la vista de Blacklist
                 if (document.getElementById('blacklist-view').style.display !== 'none') {
                     // CORRECCIÓN: Como el formulario ya es visible, solo enfocamos el campo
                     document.getElementById('bl-cpf').focus();
                     // Opcional: Hacemos scroll hacia arriba por si acaso
                     document.querySelector('main').scrollTo({ top: 0, behavior: 'smooth' });
                 } else {
                    showCompanyFormModal(); // Abre crear empresa
                 }
            });

            // --- INICIO: NUEVOS Listeners para Filtros ---
            
            // 1. Listeners para Pestañas (PRO / DEMO)
            const proFiltersContainer = document.getElementById('pro-filters-container');
            document.querySelectorAll('.tab-btn').forEach(button => {
                button.addEventListener('click', (e) => {
                    const newTab = e.currentTarget.dataset.tab;
                    if (newTab === currentFilterTab) return; // No hacer nada si ya está activa

                    currentFilterTab = newTab;
                    
                    // Actualiza UI de botones
                    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
                    e.currentTarget.classList.add('active');

                    // Oculta filtros de plan PRO si estamos en DEMO
                    if (currentFilterTab === 'demo') {
                        proFiltersContainer.style.display = 'none';
                    } else {
                        proFiltersContainer.style.display = 'flex';
                    }

                    filterAndRenderCompanies();
                });
            });

            // 2. Listener para Barra de Búsqueda (con un pequeño 'debounce')
            const searchInput = document.getElementById('company-search');
            const clearSearchBtn = document.getElementById('clear-search-btn');
            let searchTimeout;

            searchInput.addEventListener('input', (e) => {
                currentSearchTerm = e.target.value;
                clearTimeout(searchTimeout); // Resetea el timer

                // Muestra/oculta el botón 'X'
                clearSearchBtn.style.display = currentSearchTerm ? 'block' : 'none';

                // Espera 300ms después de que el usuario deje de teclear
                searchTimeout = setTimeout(() => {
                    filterAndRenderCompanies();
                }, 300); 
            });

            clearSearchBtn.addEventListener('click', () => {
                searchInput.value = '';
                currentSearchTerm = '';
                clearSearchBtn.style.display = 'none';
                filterAndRenderCompanies();
            });

            // 3. Listeners para Selects (Ordenar y Filtrar Plan)
            document.getElementById('sort-order').addEventListener('change', (e) => {
                currentSortOrder = e.target.value;
                filterAndRenderCompanies();
            });

            document.getElementById('plan-filter').addEventListener('change', (e) => {
                currentPlanFilter = e.target.value;
                filterAndRenderCompanies();
            });
            // --- FIN: NUEVOS Listeners ---
        }


        // --- Toast/Notificaciones ---
        function showToast(message, isError = false) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'toast';
            if (isError) toast.classList.add('toast-error');
            // else toast.classList.add('toast-success'); // Opcional para éxito
            toast.textContent = message;
            container.appendChild(toast);

            // Forzar reflow para activar la animación de entrada
            void toast.offsetWidth;

            toast.classList.add('show');

            // Ocultar después de 3 segundos
            setTimeout(() => {
                toast.classList.remove('show');
                // Eliminar del DOM después de la animación de salida
                toast.addEventListener('transitionend', () => {
                    if (toast.parentNode === container) { // Comprueba si aún existe
                        container.removeChild(toast);
                    }
                }, { once: true });
            }, 3000);
        }

        // --- (NUEVO) PASO 1: CÓDIGO DEL MODAL DE CONFIRMACIÓN ---
        /**
         * Muestra un modal de confirmación genérico usando los estilos CSS existentes.
         * @param {string} title - El título del modal.
         * @param {string} message - El mensaje de confirmación.
         * @param {string} confirmText - El texto del botón de confirmación (ej: "Eliminar").
         * @param {string} confirmClass - 'btn-danger' o 'btn-primary'.
         * @returns {Promise<boolean>} - Resuelve 'true' si se confirma, 'false' si se cancela.
         */
        function showConfirmationModal(title, message, confirmText = 'Confirmar', confirmClass = 'btn-danger') {
            return new Promise((resolve) => {
                // Prevenir múltiples modales
                if (document.getElementById('confirmation-modal-overlay')) {
                    document.getElementById('confirmation-modal-overlay').remove();
                }

                const modalOverlay = document.createElement('div');
                modalOverlay.id = 'confirmation-modal-overlay';
                // Usa las clases CSS que ya definiste en tu <style>
                modalOverlay.className = 'modal-overlay'; 

                modalOverlay.innerHTML = `
                    <div class="modal-content" style="max-width: 450px; transform: scale(0.95); opacity: 0; transition: transform 0.2s ease, opacity 0.2s ease;">
                        <h3 style="font-size: 1.25em; font-weight: 600; margin-top: 0; margin-bottom: 10px;">${title}</h3>
                        <p style="color: var(--text-secondary); margin-bottom: 25px; line-height: 1.5;">${message}</p>
                        <div style="display: flex; gap: 10px; justify-content: flex-end;">
                            <button id="confirm-cancel" class="btn-secondary" style="background-color: var(--surface); border-color: var(--border-color); color: var(--text-secondary);">Cancelar</button>
                            <button id="confirm-accept" class="${confirmClass}">${confirmText}</button>
                        </div>
                    </div>
                `;

                document.body.appendChild(modalOverlay);

                const modalContent = modalOverlay.querySelector('.modal-content');
                const btnCancel = modalOverlay.querySelector('#confirm-cancel');
                const btnAccept = modalOverlay.querySelector('#confirm-accept');

                // Forzar reflow para la animación de entrada
                requestAnimationFrame(() => {
                    modalOverlay.classList.add('active'); // Muestra el overlay (opacity 0 a 1)
                    modalContent.style.transform = 'scale(1)';
                    modalContent.style.opacity = '1';
                });

                const close = (result) => {
                    modalContent.style.transform = 'scale(0.95)';
                    modalContent.style.opacity = '0';
                    modalOverlay.classList.remove('active');
                    
                    // --- CORRECCIÓN ---
                    // 'transitionend' no es 100% fiable.
                    // Lo reemplazamos con un setTimeout que espera que la animación termine.
                    // Tu animación CSS dura 0.2s (200ms), así que esperamos 250ms.
                    setTimeout(() => {
                        if (document.body.contains(modalOverlay)) {
                            document.body.removeChild(modalOverlay);
                        }
                        resolve(result); // Resuelve la promesa
                    }, 250); // 250ms (un poco más que tu transición de 0.2s)
                    // --- FIN DE LA CORRECCIÓN ---
                };

                // Event Listeners
                modalOverlay.addEventListener('click', () => close(false)); // Clic en el fondo
                modalContent.addEventListener('click', e => e.stopPropagation()); // Evita que el clic en el modal lo cierre
                btnCancel.addEventListener('click', () => close(false));
                btnAccept.addEventListener('click', () => close(true));
            });
        }
        
        // --- FUNCIONES BLACKLIST (NUEVO) ---

        // 1. Función para cambiar de vista (Pestañas)
        window.switchView = function(viewId, btnElement) {
            // Ocultar todas las vistas
            document.getElementById('companies-view').style.display = 'none';
            document.getElementById('blacklist-view').style.display = 'none';
            
            // Mostrar la seleccionada
            document.getElementById(viewId).style.display = 'block';

            // Actualizar botones (colores)
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            if(btnElement) btnElement.classList.add('active');

            // Si abrimos la vista blacklist, cargamos los datos
            if(viewId === 'blacklist-view') {
                loadBlacklist();
            }
        }

        // 2. Cargar datos desde Firebase
        window.loadBlacklist = function() {
            // Escuchar la colección 'blacklisted_customers'
            onSnapshot(collection(db, 'blacklisted_customers'), (snapshot) => {
                blacklistData = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                renderBlacklist();
            });
        }

        // 3. Mostrar la lista en pantalla
        window.renderBlacklist = function() {
            const container = document.getElementById('blacklist-list');
            const term = document.getElementById('blacklist-search').value.toLowerCase();
            
            // Filtrar por búsqueda
            const filtered = blacklistData.filter(i => 
                (i.cpf || '').includes(term) || (i.name || '').toLowerCase().includes(term)
            );

            if (filtered.length === 0) {
                container.innerHTML = '<p style="text-align:center; color:gray; padding:20px;">No hay registros encontrados.</p>';
                return;
            }

            // Generar HTML
            container.innerHTML = filtered.map(item => `
                <div class="blacklist-card">
                    <div class="blacklist-header">
                        <span class="blacklist-cpf">${item.cpf}</span>
                        <button onclick="deleteFromBlacklist('${item.id}')" title="Eliminar" style="background:none; border:none; color: gray; cursor:pointer;">
                            <i data-lucide="trash-2"></i>
                        </button>
                    </div>
                    <div style="font-weight:600; font-size: 1.1em;">${item.name}</div>
                    <div class="blacklist-reason">" ${item.reason || 'Sin motivo especificado'} "</div>
                    <div style="font-size: 0.75em; color: gray; margin-top: 5px;">Reportado: ${item.createdAt ? new Date(item.createdAt.seconds * 1000).toLocaleDateString() : 'N/A'}</div>
                </div>
            `).join('');
            
            // Actualizar iconos
            lucide.createIcons();
        }

        // 4. Guardar en Firebase
        window.addToBlacklist = async function() {
            const cpf = document.getElementById('bl-cpf').value.trim();
            const name = document.getElementById('bl-name').value.trim();
            const reason = document.getElementById('bl-reason').value.trim();

            if(!cpf || !name) {
                showToast("CPF y Nombre son obligatorios", true);
                return;
            }

            try {
                await addDoc(collection(db, 'blacklisted_customers'), {
                    cpf: cpf,
                    name: name,
                    reason: reason,
                    createdAt: serverTimestamp(),
                    createdBy: 'Super Admin'
                });
                showToast("Cliente agregado a lista de riesgo");
                // Limpiar campos
                document.getElementById('bl-cpf').value = '';
                document.getElementById('bl-name').value = '';
                document.getElementById('bl-reason').value = '';
            } catch(e) {
                console.error(e);
                showToast("Error al guardar: " + e.message, true);
            }
        }

        // 5. Borrar de Firebase
        window.deleteFromBlacklist = async function(id) {
            // Usamos el confirm nativo del navegador para rapidez
            if(confirm("¿Seguro que deseas quitar a este cliente de la lista negra?")) {
                try {
                    await deleteDoc(doc(db, 'blacklisted_customers', id));
                    showToast("Registro eliminado");
                } catch(e) {
                    console.error(e);
                    showToast("Error al eliminar", true);
                }
            }
        }

        function initializeAppLogic() {
            // Listener principal de autenticación
            onAuthStateChanged(auth, (user) => {
                if (user) {
                    console.log("AuthStateChanged: Usuario autenticado:", user.uid);
                    // --- INICIALIZACIÓN DE FUNCTIONS ---
                    if (!functions) {
                        console.log("Inicializando SDK de Functions...");
                        functions = getFunctions(app); // Inicializa la variable global 'functions'
                    }
                    // --- FIN INICIALIZACIÓN ---

                    // TODO: Añadir verificación de Custom Claim de Super Admin
                    // por ahora, si está logueado, mostramos la app.
                    showSuperAdminApp(user);
                } else {
                    console.log("AuthStateChanged: Usuario NO autenticado.");
                    showLoginView();
                }
            });

             // Solución simple para 'popstate' (reemplazando el 'popstate' anterior)
             window.onpopstate = function(event) {
                // Cerramos CUALQUIER modal de vista completa
                 const activeModal = document.querySelector('.modal-view.active');
                 if (activeModal) {
                     activeModal.classList.remove('active');
                 }
             };
        }

        // --- Punto de Entrada ---
        document.addEventListener('DOMContentLoaded', () => {
            initializeAppLogic();
        });

    </script>
</body>
